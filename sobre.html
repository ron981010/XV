<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Luciérnagas Realistas</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #000;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }

    .webp-firefly {
      position: absolute;
      background-image: url('assets/weyv.webp');
      background-size: contain;
      background-repeat: no-repeat;
      pointer-events: none;
      opacity: 0.9;
      will-change: transform;
      transition: transform 0.2s linear;
    }
  </style>
</head>
<body>

  <script>
    const NUM_FIREFLIES = 6;
    const fireflies = [];
    const MARGIN = 20; // margen para que salgan un poco
    const BASE_SPEED = 0.2; // velocidad reducida

    function createFirefly() {
      const el = document.createElement('div');
      el.className = 'webp-firefly';

      const size = Math.random() * 50 + 80;
      el.style.width = `${size}px`;
      el.style.height = `${size}px`;

      const x = Math.random() * (window.innerWidth - size);
      const y = Math.random() * (window.innerHeight - size);
      const vx = (Math.random() - 0.5) * BASE_SPEED;
      const vy = (Math.random() - 0.5) * BASE_SPEED;

      document.body.appendChild(el);
      fireflies.push({ el, x, y, vx, vy, size, facingRight: vx > 0 });
    }

    function updateFireflies() {
      for (let f of fireflies) {
        f.x += f.vx;
        f.y += f.vy;

        // Rebotar en bordes verticales
        if (f.y <= 0 || f.y >= window.innerHeight - f.size) {
          f.vy *= -1;
        }

        // Rebotar en bordes horizontales con margen
        if (f.x <= -MARGIN) {
          f.vx = Math.abs(f.vx);
          f.facingRight = true;
        } else if (f.x >= window.innerWidth - f.size + MARGIN) {
          f.vx = -Math.abs(f.vx);
          f.facingRight = false;
        }

        const transform = `translate(${f.x}px, ${f.y}px) scaleX(${f.facingRight ? 1 : -1})`;
        f.el.style.transform = transform;
      }

      requestAnimationFrame(updateFireflies);
    }

    function addImpulse(strength = 0.5) {
      fireflies.forEach(f => {
        f.vx += (Math.random() - 0.5) * strength;
        f.vy += (Math.random() - 0.5) * strength;
      });
    }

    // Crear luciérnagas
    for (let i = 0; i < NUM_FIREFLIES; i++) {
      createFirefly();
    }

    updateFireflies();

    // Eventos para añadir movimiento
    window.addEventListener('scroll', () => addImpulse(0.8));
    window.addEventListener('touchstart', () => addImpulse(1));
  </script>

</body>
</html>
